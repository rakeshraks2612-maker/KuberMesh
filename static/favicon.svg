<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="km-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="km-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="km-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="14" fill="#090d16" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />
  
  <!-- Outer glowing hexagon -->
  <polygon points="32 10 52 21 52 43 32 54 12 43 12 21" 
           fill="rgba(2, 132, 199, 0.15)" 
           stroke="url(#km-mesh)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#km-glow)" />

  <!-- Inner isometric lines -->
  <polyline points="32 10 32 32 52 21" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="32 32 12 21" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="32 32 32 54" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center energy core -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" filter="url(#km-glow)" />
  <circle cx="32" cy="32" r="2" fill="#0284c7" />
</svg>
